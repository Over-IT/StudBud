<!doctype html><meta charset="utf-8"><title>Rooftop Rumble - practice</title>
<style>html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:8px;left:12px;color:#fff;font:600 14px system-ui;text-shadow:0 1px 3px #000;pointer-events:none}</style>
<canvas id="c"></canvas><div id="hud"></div>
<script src="multiplayerEngine.js"></script>
<script src="multiplayerGames.js"></script>
<script>
const A = window.StudBudArcade, cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud');
const seed = Number(new URLSearchParams(location.search).get('seed')) || 12345;
const s = {
    seed, local: { color: '#38bdf8', cos: {} }, t: 0, startedAt: Date.now(), done: false, finishMs: 0, over: false, paused: false, question: null, score: 0, vw: 0, vh: 0,
    keys: new Set(), just: new Set(), mouse: { x: 0, y: 0 },
    down(...c) { return c.some(k => this.keys.has(k)); },
    pressed(...c) { return c.some(k => this.just.has(k)); },
    axis() { return { x: (this.keys.has('KeyD') || this.keys.has('ArrowRight') ? 1 : 0) - (this.keys.has('KeyA') || this.keys.has('ArrowLeft') ? 1 : 0), y: 0 }; },
    spend(n) { return this.game.res.spend(n); },
    refill() { this.game.res.add(40); }, sfx() { }, toast(t) { hud.dataset.msg = t; }, ask(cb) { cb(true); return true; }, remoteList() { return []; }, emit() { }, send() { }, rewardAmount() { return 40; }
};
const g = new A.games.skyline(s); s.game = g;
addEventListener('keydown', e => { if (!e.repeat) s.just.add(e.code); s.keys.add(e.code); if (e.code === 'KeyQ') s.refill(); if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => s.keys.delete(e.code));
let last = performance.now();
function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
    if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    s.vw = w; s.vh = h; s.t += dt;
    if (g.res.value < 30) g.res.value = 100; // practice: energy never runs out
    g.update(dt); s.just.clear();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.draw(ctx, w, h);
    hud.textContent = `Height ${Math.round(g.maxH / 40)}m / ${Math.round(g.summitH / 40)}m   |   A/D move · Space jump (x2) · Shift dash · walls: jump off them   |   ${hud.dataset.msg || ''}`;
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
