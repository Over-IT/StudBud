<!doctype html><meta charset="utf-8"><title>rr test</title>
<script src="multiplayerEngine.js"></script>
<script src="multiplayerGames.js"></script>
<script>
window.runRR = async function (seed, budgetMs) {
    const A = window.StudBudArcade;
    const t0 = performance.now();
    const realNow = Date.now.bind(Date);
    let clockMs = 0;
    const base = 1700000000000;
    Date.now = () => base + clockMs;
    const s = {
        seed, local: { color: '#fff', cos: {} }, t: 0, startedAt: base, done: false, finishMs: 0, over: false, paused: false, question: null,
        keysDown: new Set(), keysPressed: new Set(),
        down(...c) { return c.some(k => this.keysDown.has(k)); },
        pressed(...c) { return c.some(k => this.keysPressed.has(k)); },
        axis() { return { x: (this.keysDown.has('KeyD') ? 1 : 0) - (this.keysDown.has('KeyA') ? 1 : 0), y: 0 }; },
        spend(n) { return this.game.res.spend(n); },
        sfx() { }, toast() { }, ask() { return false; }, remoteList() { return []; }, emit() { }, send() { }
    };
    const g = new A.games.skyline(s);
    s.game = g;
    g.hurt = () => { };
    const all = g.solids;
    const platforms = all.filter(p => !p.wall);
    const summit = g.summit;
    const startP = platforms.find(p => p.ground);
    const reached = new Map(); reached.set(startP, 0);
    const queue = [startP];
    const dt = 1 / 60;
    const FIELDS = ['coyote', 'buffer', 'airJumps', 'dash', 'dashCd', 'boost', 'slow', 'kick', 'sprung', 'wasExhausted', 'wallDir', 'finished', 'dead'];
    function bounds(p) {
        const amp = p.mover ? p.amp : 0;
        return p.vert ? { x: p.bx, y: p.by - amp, w: p.w, h: p.h + 2 * amp } : { x: (p.bx ?? p.x) - amp, y: p.y, w: p.w + 2 * amp, h: p.h };
    }
    let sims = 0;
    while (queue.length) {
        if (performance.now() - t0 > budgetMs) break;
        const P = queue.shift();
        const pb = bounds(P);
        const near = all.filter(o => { const b = bounds(o); return b.x < pb.x + pb.w + 900 && b.x + b.w > pb.x - 900 && b.y < pb.y + 700 && b.y + b.h > pb.y - 900; });
        g.solids = near;
        const wasNear = new Set(near);
        for (const clk of [0, 2.1]) {
            const fracs = P.w > 300 ? [0.05, 0.5, 0.95] : [0.2, 0.8];
            for (const f of fracs) for (const dir of [-1, 0, 1]) for (const dj of [-1, 0.25, 0.5]) for (const dsh of [-1, 0.25]) for (const wj of [0, 1, 2]) for (const hold of [0.12, 1]) {
                if (wj === 2 && (dir === 0 || dj !== -1 || dsh !== -1)) continue;
                clockMs = clk * 1000;
                for (const c of g.crumbles) { c.timer = 0; c.gone = 0; c.off = false; }
                for (const k of FIELDS) g[k] = 0;
                g.sprung = false; g.airJumps = 1; g.tideY = 1e9; g.res.value = 100;
                g.dtLast = dt; g.cam = { x: 0, y: 0 };
                const me = g.me;
                me.w = 26; me.h = 44; me.vx = 0; me.vy = 0; me.face = 1; me.onGround = true; me.ground = P; me.wall = 0;
                // standing position, then step once to settle on a moving platform
                const px = P.mover ? P.bx : P.x;
                me.x = px + (P.w - me.w) * f; me.y = P.y - me.h;
                s.keysDown = new Set(); s.keysPressed = new Set();
                // let the platform position sync with the clock
                s.t = 0;
                let wallCd = 0, left = false;
                let curDir = dir;
                for (let i = 0; i < (wj === 2 ? 700 : 90); i++) {
                    const tt = i * dt;
                    s.keysDown = new Set(); s.keysPressed = new Set();
                    if (wj === 2 && g.wallDir && i > 5) curDir = -g.wallDir;
                    if (curDir < 0) s.keysDown.add('KeyA'); if (curDir > 0) s.keysDown.add('KeyD');
                    if (i === 3) { s.keysPressed.add('Space'); }
                    if (tt < 3 * dt + hold) s.keysDown.add('Space');
                    if (i > 3 && Math.abs(tt - dj) < dt / 2) { s.keysPressed.add('Space'); s.keysDown.add('Space'); }
                    if (Math.abs(tt - dsh) < dt / 2) s.keysPressed.add('ShiftLeft');
                    wallCd -= dt;
                    if (wj > 0 && g.wallDir && wallCd <= 0 && i > 5) { s.keysPressed.add('Space'); s.keysDown.add('Space'); wallCd = 0.3; }
                    clockMs = clk * 1000 + i * dt * 1000;
                    s.t = i * dt;
                    g.update(dt);
                    sims++;
                    if (i > 4 && !me.onGround) left = true;
                    if (left && me.onGround && me.ground && me.ground !== P && !reached.has(me.ground)) {
                        reached.set(me.ground, reached.get(P) + 1);
                        queue.push(me.ground);
                    }
                    if (me.y > P.y + 900) break;
                }
                g.res.value = 100;
            }
        }
        g.solids = all;
        await new Promise(r => setTimeout(r));
    }
    Date.now = realNow; window.__g = g; window.__reached = reached;
    const kinds = {};
    for (const p of platforms) { const k = p.mover ? (p.vert ? 'lift' : 'mover') : p.crumble ? 'crumble' : p.belt ? 'belt' : p.ice ? 'ice' : p.wallJ ? 'wall' : p.roof ? 'roof' : 'ledge'; kinds[k] = kinds[k] || { total: 0, reached: 0 }; kinds[k].total++; if (reached.has(p)) kinds[k].reached++; }
    let highest = Infinity; for (const p of reached.keys()) if (p.y < highest) highest = p.y;
    const unreachedMain = platforms.filter(p => !reached.has(p) && (p.roof)).map(p => Math.round(p.y));
    return {
        summitReached: reached.has(summit), summitY: summit.y, highestReachedY: Math.round(highest), sims, queueLeft: queue.length,
        total: platforms.length, reachedCount: reached.size, kinds, unreachedRoofs: unreachedMain.slice(0, 20), ms: Math.round(performance.now() - t0),
        counts: { saws: g.saws.length, spikes: g.spikes.length, lasers: g.lasers.length, springs: g.springs.length, boxes: g.boxes.length, movers: g.movers.length, crumbles: g.crumbles.length, winds: g.winds.length, balls: g.balls.length, checkpoints: g.checkpoints.length }
    };
};
</script>
